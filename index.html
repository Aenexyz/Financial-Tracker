<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vault">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0b0c">
<title>Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, private, exact — a banking app you trust with one thumb.
   IDEA: a leather wallet: each account is a physical card you flip through.
   PICTURE: the stack of richly coloured cards is the app itself.
   COLOUR and TYPE: white or near-black ground, cards carry the colour, coral accent; Manrope, tabular figures.
   LAYOUT: one phone column, sticky segmented tabs, bottom sheets for editing. */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0b0b0c);--soft:light-dark(#f1f1ef,#17171a);--ink:light-dark(#111113,#f4f4f5);--mut:light-dark(#66666c,#9b9ba3);--line:light-dark(#e3e3e0,#27272c);--acc:#ff4d2e;--pos:light-dark(#0a7a4d,#3ccf8e);--neg:light-dark(#c2261b,#ff8070);--warn:light-dark(#b45309,#fbbf24)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,-apple-system,sans-serif;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
[hidden]{display:none!important}

/* lock */
.lock{position:fixed;inset:0;z-index:50;background:#0b0b0c;color:#f4f4f5;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 56px) 24px calc(env(safe-area-inset-bottom) + 28px)}
.lk-top{text-align:center;display:grid;justify-items:center;gap:10px}
.lk-top h1{margin:6px 0 0;font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-.02em}
.lk-top p{margin:0;color:#a1a1aa;font-size:16px;min-height:24px}
.lk-top p.err{color:#ff8070}
.dots{display:flex;gap:12px;height:20px;align-items:center;margin-top:14px}
.dots i{width:13px;height:13px;border-radius:50%;background:#f4f4f5;animation:pop .14s ease-out}
.dots.none::before{content:"";width:2px;height:22px;background:var(--acc);animation:blink 1s steps(2) infinite}
.shake{animation:shake .4s}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:18px 26px;justify-content:center}
.pad button{width:78px;height:78px;border-radius:50%;border:0;background:rgba(255,255,255,.09);color:#fff;font-size:30px;font-weight:500;display:grid;place-items:center;transition:background .1s}
.pad button:active{background:rgba(255,255,255,.26)}
.pad .ghost{background:transparent;font-size:16px;font-weight:600}
.pad .ok{background:var(--acc)}
.lk-note{margin:0;color:#71717a;font-size:13px}

/* app */
.app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 110px)}
.bar1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.acts{display:flex;gap:6px}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center}
.ib svg{width:21px;height:21px}
.hero{padding:22px 0 18px}
.lbl{margin:0;color:var(--mut);font-size:14px;font-weight:600}
.big{margin:2px 0 14px;font-size:clamp(34px,11vw,48px);line-height:1.05;font-weight:800;letter-spacing:-.03em}
.split{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.split div{background:var(--soft);border-radius:16px;padding:10px 12px}
.split span{display:block;font-size:13px;color:var(--mut);font-weight:600}
.split b{font-size:15px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px max(6px,calc((100vw - 540px)/2)) calc(env(safe-area-inset-bottom) + 4px);background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.alerts{margin:4px 0 6px;border-radius:20px;padding:14px 14px 8px;background:color-mix(in srgb,var(--neg) 9%,var(--bg));border:1.5px solid color-mix(in srgb,var(--neg) 35%,transparent);animation:rise .4s both}
.alerts.soon{background:color-mix(in srgb,var(--warn) 10%,var(--bg));border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.al-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;margin:0 2px 6px}
.al-row{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:6px 0}
.al-row:first-of-type{border-top:0}
.al-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;min-height:48px;padding:0 2px}
.al-main b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.al-main small{font-size:13px;font-weight:700}
.paid{flex:none;height:40px;padding:0 14px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);font-weight:800;font-size:14px}
.wi{width:20px;height:20px;flex:none;vertical-align:-4px}
.past{color:var(--neg)}.soon{color:var(--warn)}
.row.r-past{background:color-mix(in srgb,var(--neg) 8%,transparent)}
.rt b .wi{width:17px;height:17px;margin-left:5px;flex:none}
.rt small.past,.rt small.soon{font-weight:700}.rt small.past{color:var(--neg)}.rt small.soon{color:var(--warn)}
.duechip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:4px 9px 4px 7px;border-radius:99px;white-space:nowrap;background:#fff;color:#b42318}
.duechip.soon{color:#92400e;background:#fde68a}
.duechip .wi{width:15px;height:15px}
.c-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--neg);color:#fff;font-size:11px;font-weight:800;line-height:18px;text-align:center}
.f input[type=date]{-webkit-appearance:none;appearance:none;display:block;line-height:50px}
.tabbar button{position:relative;border:0;background:none;display:grid;justify-items:center;gap:3px;padding:4px 0;min-height:52px;color:var(--mut);font-size:12px;font-weight:700}
.tabbar svg{width:25px;height:25px}
.tabbar button[aria-selected=true]{color:var(--acc)}
.per{display:inline-grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:13px;background:var(--soft);flex:none}
.per button{border:0;background:none;height:40px;padding:0 14px;border-radius:10px;font-weight:700;font-size:14px;color:var(--mut)}
.per button[aria-pressed=true]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.sec .per{align-self:center}
.sum{background:var(--soft);border-radius:24px;padding:20px}
.big2{margin:2px 0 4px;font-size:clamp(32px,10vw,42px);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.sum .sub{margin:0}
.flow{display:flex;gap:3px;height:16px;margin:18px 0 10px}
.flow i{display:block;height:100%;border-radius:5px;min-width:4px}
.lg{display:grid;grid-template-columns:12px minmax(0,1fr) auto 44px;gap:10px;align-items:center;font-size:15px;padding:7px 0;border-top:1px solid var(--line)}
.lg:first-of-type{border-top:0}
.lg i{width:12px;height:12px;border-radius:4px}
.lg em{font-style:normal;color:var(--mut);text-align:right;font-size:14px}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:8px 0;font-size:15px}
.cat .mt{grid-column:1/-1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.cat .mt i{display:block;height:100%;border-radius:4px}
.cat span:nth-child(2){font-weight:700}
.group{background:var(--soft);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.group>.row:first-child{border-top:0}
.ri{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;color:#fff;font-weight:800;font-size:15px}
.rt{flex:1;min-width:0}.rt b{display:flex;align-items:center;font-weight:700;min-width:0}.rt b .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.rt small{color:var(--mut);font-size:13px}
.ra{text-align:right;font-weight:800}.ra small{display:block;color:var(--mut);font-weight:600;font-size:13px}
.chev{color:var(--mut);font-size:20px;margin-left:-4px}
.addrow{justify-content:center;color:var(--acc);font-weight:800;min-height:56px}
.gh{display:flex;justify-content:space-between;margin:18px 4px 8px;font-size:14px;font-weight:700;color:var(--mut)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tiles div{background:var(--soft);border-radius:16px;padding:12px}
.tiles span{display:block;color:var(--mut);font-size:13px;font-weight:600}.tiles b{font-size:16px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 2px 12px}
.sec h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.sec span{color:var(--mut);font-size:15px;font-weight:600}
.sub{margin:-6px 2px 14px;color:var(--mut);font-size:14px}
.list{display:grid;gap:14px}
.card{--c:#2b2d42;position:relative;overflow:hidden;width:100%;text-align:left;border:0;border-radius:22px;padding:18px 20px 20px;color:#fff;min-height:190px;display:flex;flex-direction:column;gap:12px;
 background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.24),transparent 55%),radial-gradient(60% 60% at 0% 110%,rgba(0,0,0,.28),transparent 70%),linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));
 box-shadow:0 14px 28px -16px color-mix(in srgb,var(--c) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.25);animation:rise .45s both}
.card:active{transform:scale(.985)}
.c-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bank{font-size:18px;font-weight:800;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kind{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.18);white-space:nowrap}
.c-mid{display:flex;align-items:center;gap:10px;font-size:15px;opacity:.9}
.chip{width:34px;height:25px;border-radius:6px;flex:none;background:linear-gradient(135deg,#f3d27a,#b8912f);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.c-bal{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.c-bal small{display:block;font-size:13px;opacity:.75;font-weight:600}
.c-bal strong{font-size:clamp(24px,7.5vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.c-bal em{font-style:normal;font-size:13px;opacity:.8;text-align:right}
.meter{height:6px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
.meter i{display:block;height:100%;background:#fff;border-radius:3px}
.coins{display:grid;gap:6px;background:rgba(0,0,0,.18);border-radius:14px;padding:10px 12px}
.coin{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.ci{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.coin b{font-weight:700}.coin span{opacity:.75}
.add{width:100%;height:56px;border-radius:18px;border:1.5px dashed var(--line);background:transparent;color:var(--mut);font-weight:700;font-size:15px}
.empty{padding:22px;border-radius:18px;background:var(--soft);color:var(--mut);text-align:center;font-size:15px}
.note{margin:14px 2px 0;padding:12px 14px;border-radius:14px;background:var(--soft);font-size:14px;color:var(--mut);display:flex;gap:10px;align-items:center;justify-content:space-between}
.note button{border:0;background:none;color:var(--acc);font-weight:700;min-height:44px;padding:0 4px;white-space:nowrap}
.foot{margin:28px 0 0;text-align:center;color:var(--mut);font-size:13px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);animation:fade .2s}
.panel{position:relative;width:100%;max-width:520px;max-height:90vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 20px);animation:up .28s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.panel h3{margin:4px 0 16px;font-size:24px;font-weight:800;letter-spacing:-.01em}
.f{display:grid;gap:6px;margin-bottom:14px}
.f label,.flab{font-size:14px;font-weight:700;color:var(--mut)}
.f input,.f select,.crow input{height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);padding:0 14px;font-size:16px;width:100%}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.sw{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 16px}
.sw label{position:relative}
.sw input{position:absolute;opacity:0}
.sw span{display:block;width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.sw input:checked+span{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.sw input:focus-visible+span{outline:3px solid var(--acc);outline-offset:4px}
.sw .cus input[type=color]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.crow{display:grid;grid-template-columns:72px minmax(0,1fr) minmax(0,1.2fr) 44px;gap:8px;margin-bottom:8px}
.crow input{padding:0 10px}
.x{height:50px;border:0;border-radius:14px;background:var(--soft);font-size:20px;color:var(--mut)}
.lnk{border:0;background:none;color:var(--acc);font-weight:700;min-height:44px;padding:0;margin-bottom:10px}
.btns{display:grid;gap:10px;margin-top:8px}
.pri,.sec2,.del{height:54px;border-radius:16px;border:0;font-weight:800;font-size:16px}
.pri{background:var(--acc);color:#fff}
.sec2{background:var(--soft)}
.del{background:transparent;color:var(--neg)}
.hint{font-size:13px;color:var(--mut);margin:0 0 14px}
.filebtn{display:grid;place-items:center;cursor:pointer}
.rates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:6px}
.rt2{display:flex;align-items:center;gap:8px;height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);padding:0 6px 0 12px}
.rt2 span{font-size:14px;font-weight:700;color:var(--mut);flex:none;white-space:nowrap}
.rt2 input{border:0;background:none;height:100%;width:100%;font-size:16px;text-align:right;padding:0 6px}
.c-bal span small.num{margin-top:2px;opacity:.8}

@keyframes pop{from{transform:scale(.3)}}
@keyframes blink{50%{opacity:0}}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="lock" class="lock" role="dialog" aria-label="Locked">
  <div class="lk-top">
    <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><rect x="4" y="12" width="48" height="34" rx="9" fill="#ff4d2e"/><rect x="4" y="19" width="48" height="6" fill="#0b0b0c" opacity=".35"/><rect x="11" y="32" width="12" height="8" rx="2" fill="#f3d27a"/></svg>
    <h1>Vault</h1>
    <p id="lkMsg">Enter passcode</p>
    <div id="dots" class="dots none" aria-live="polite"></div>
  </div>
  <div class="pad" id="pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="del" class="ghost" aria-label="Delete">Delete</button><button data-k="0">0</button>
    <button data-k="ok" class="ok" aria-label="Unlock"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
  </div>
  <p class="lk-note">Locks itself when you leave the app</p>
</div>

<main id="app" class="app" hidden>
  <div class="bar1">
    <span class="brand"><svg width="26" height="26" viewBox="0 0 56 56" aria-hidden="true"><rect x="4" y="12" width="48" height="34" rx="9" fill="#ff4d2e"/><rect x="11" y="32" width="12" height="8" rx="2" fill="#f3d27a"/></svg>Vault</span>
    <div class="acts">
      <button class="ib" id="eye" aria-label="Hide balances"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button class="ib" id="setBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
      <button class="ib" id="lockBtn" aria-label="Lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
    </div>
  </div>
  <div class="hero">
    <p class="lbl">Net worth</p>
    <p class="big num" id="net"></p>
    <div class="split" id="split"></div>
  </div>
  <div id="alerts"></div>
  <div id="sampleNote"></div>
  <section id="view"></section>
  <p class="foot" id="sync"></p>
  <nav class="tabbar" role="tablist" id="seg">
    <button role="tab" data-tab="savings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18"/></svg>Savings</button>
    <button role="tab" data-tab="credit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M6 15h4"/></svg>Cards</button>
    <button role="tab" data-tab="loans"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 14l6-6"/><circle cx="9.5" cy="8.5" r=".6"/><circle cx="14.5" cy="13.5" r=".6"/></svg>Loans</button>
    <button role="tab" data-tab="cashflow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20V5M3 9l4-4 4 4M17 4v15M13 15l4 4 4-4"/></svg>Cashflow</button>
    <button role="tab" data-tab="expenses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Expenses</button>
  </nav>
</main>

<div id="sheet" class="sheet" hidden>
  <div class="scrim" id="scrim"></div>
  <form class="panel" id="form" novalidate></form>
</div>

<script>
{
const HASH='9c4c9ac1f1374326981802fc2cda6ae2739e39f78f002aa1158f8bdb930de18e';
function sha256(a){const rr=(v,n)=>(v>>>n)|(v<<(32-n)),M=2**32;let h=[],k=[],pc=0,cmp={},w=[],L=a.length*8,i,j,r='';

let code='',awayAt=0;

function drawDots(){dots.innerHTML='<i></i>'.repeat(Math.min(code.length,14));dots.classList.toggle('none',!code)}
function press(k){
 if(k==='del'){code=code.slice(0,-1)}
 else if(k==='ok'){if(!tryCode())fail();return}
 else if(code.length<16){code+=k;lkMsg.textContent='Enter passcode';lkMsg.className=''}

}
function tryCode(){if(code&&sha256('vault:'+code)===HASH){unlock();return true}return false}
function fail(){lkMsg.textContent=code?'Wrong passcode — try again':'Enter passcode';lkMsg.className=code?'err':'';dots.classList.remove('shake');void dots.offsetWidth;dots.classList.add('shake');code='';drawDots()}

const ccExp=()=>of('credit').filter(a=>num(a.minDue)>0).map(a=>({id:a.id,name:(a.bank?a.bank+' ':'')+(a.name||'card'),cat:'Credit cards',amount:num(a.minDue),freq:'month',cur:a.cur,dueDate:a.dueDate,cc:true}));
const allExp=()=>[...S.expenses,...ccExp()];
const byCat=()=>{const o={};allExp().forEach(x=>{const c=CATS[x.cat]?x.cat:'Other';(o[c]=o[c]||[]).push(x)});return Object.entries(o).map(([c,l])=>[c,l,l.reduce((s,x)=>s+perWeekM(x),0)]).sort((a,b)=>b[2]-a[2])};
function renderCashflow(){
 const inc=S.income.reduce((s,x)=>s+perWeekM(x),0),exp=allExp().reduce((s,x)=>s+perWeekM(x),0);
 const lnW=of('loan').reduce((s,a)=>s+loanWk(a),0),out=exp+lnW,left=inc-out,base=Math.max(inc,out)||1;
 const pct=v=>inc?Math.round(v/inc*100)+'%':'—';
 const segs=[['Expenses','#ff4d2e',exp],['Loan repayments','#5b2a86',lnW],['Left over','var(--pos)',Math.max(0,left)]];
 let h=head('Cashflow');
 h+=`<div class="sum"><p class="lbl">${left>=0?'Left over':'Short'} each ${S.period==='month'?'month':'week'}</p><p class="big2 num ${left>=0?'pos':'neg'}">${m(P(Math.abs(left)))}</p>
  <p class="sub">${inc?(left>=0?`You keep ${pct(left)} of what comes in.`:`Money out is ${m(P(-left))} more than money in.`):'Add your income to see your cashflow.'}</p>
  ${inc||out?`<div class="flow" aria-hidden="true">${segs.filter(s=>s[2]>0).map(s=>`<i style="background:${s[1]};flex:${s[2]/base}"></i>`).join('')}${inc<out?'':''}</div>`:''}
  <div class="lg"><i style="background:var(--ink)"></i><span>Money in</span><b class="num">${m(P(inc))}</b><em></em></div>
  ${segs.map(s=>`<div class="lg"><i style="background:${s[1]}"></i><span>${s[0]}</span><b class="num">${m(P(s[0]==='Left over'?left:s[2]))}</b><em class="num">${pct(s[0]==='Left over'?left:s[2])}</em></div>`).join('')}</div>`;
 h+=`<div class="sec"><h2>Income</h2><span class="num">${m(P(inc))}${PS()}</span></div><div class="group">${S.income.map(x=>itemRow(x,'income')).join('')}<button class="row addrow" data-additem="income">+ Add income</button></div>`;
 h+=`<div class="sec"><h2>Money out</h2><span class="num">${m(P(out))}${PS()}</span></div><div class="group">
  <button class="row" data-go="expenses"><span class="ri" style="background:#ff4d2e">E</span><span class="rt"><b>Expenses</b><small>${allExp().length} item${allExp().length===1?'':'s'} · see Expenses tab</small></span><span class="ra num">${m(P(exp))}<small>${PS()}</small></span><span class="chev">›</span></button>
  <button class="row" data-go="loans"><span class="ri" style="background:#5b2a86">L</span><span class="rt"><b>Loan repayments</b><small>${of('loan').length} loan${of('loan').length===1?'':'s'} · from Loans tab</small></span><span class="ra num">${m(P(lnW))}<small>${PS()}</small></span><span class="chev">›</span></button></div>`;
 h+=`<div class="sec"><h2>At this pace</h2></div><div class="tiles"><div><span>Per week</span><b class="num ${left<0?'neg':''}">${m(left)}</b></div><div><span>Per month</span><b class="num ${left<0?'neg':''}">${m(left*52/12)}</b></div><div><span>Per year</span><b class="num ${left<0?'neg':''}">${m(left*52)}</b></div></div>`;

function renderExpenses(){

 if(!bank){const i=$('#bank');i.focus();i.style.borderColor='var(--neg)';return}
 const a=editing||{id:uid(),type:t};
 Object.assign(a,{bank,name:String(f.get('name')||'').trim(),cur:CUR.includes(f.get('acur'))?f.get('acur'):S.currency,color:okColor(f.get('color'))?f.get('color'):COLORS[0]});
 if(t!=='crypto')a.last4=String(f.get('last4')||'').replace(/\D/g,'').slice(0,4);
 if(t!=='crypto')a.balance=num(f.get('balance'));
 if(t==='credit'){a.limit=num(f.get('limit'));a.minDue=num(f.get('minDue'));setDue(a,f.get('due'))}
 if(t==='loan'){a.original=num(f.get('original'));a.rate=num(f.get('rate'));a.monthly=num(f.get('monthly'));a.payFreq=LFREQ[f.get('payFreq')]?f.get('payFreq'):'month';setDue(a,f.get('due'))}
 if(t==='crypto')a.coins=[...form.querySelectorAll('.crow')].map(r=>{const i=r.querySelectorAll('input');return{sym:i[0].value.trim().toUpperCase(),qty:num(i[1].value),value:num(i[2].value)}}).filter(c=>c.sym);
 if(!editing)S.accounts.push(a);
 S.sample=false;save();closeSheet();render();
});

/* ---------- saving ---------- */
let tmr=0,writing=false,again=false;
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}clearTimeout(tmr);tmr=setTimeout(push,500)}
async function push(){
 if(!ref)return;if(writing){again=true;return}writing=true;
 try{await ref.set(JSON.parse(JSON.stringify({accounts:S.accounts,income:S.income,expenses:S.expenses,v:S.v,remind:S.remind,period:S.period,currency:S.currency,rates:S.rates,sample:!!S.sample,flowSample:!!S.flowSample,updated:Date.now()})));syncMsg='Synced to your Claude account · private to you'}
 catch(e){syncMsg='Saved on this device only — sync unavailable'}
 writing=false;if(again){again=false;push()}else if(!$('#app').hidden)$('#sync').textContent=syncMsg;
}
(async()=>{
 try{
  if(!window.claude||!claude.use)return;
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return;
  const id=await user.id();if(!id)return;
  ref=db.doc('data/users/'+id+'/vault');
  const snap=await ref.get(),d=snap.exists?snap.data():null;
  if(d&&Array.isArray(d.accounts)){S=JSON.parse(JSON.stringify({accounts:d.accounts,income:d.income,expenses:d.expenses,period:d.period,rates:d.rates,v:d.v,remind:d.remind,currency:CUR.includes(d.currency)?d.currency:'PHP',sample:!!d.sample,flowSample:!!d.flowSample}));ensureFlow();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}syncMsg='Synced to your Claude account · private to you'}
  else if(!S.sample)push();
  else syncMsg='Sync ready — your edits will be saved to your Claude account';
  if(!$('#app').hidden)render();
 }catch(e){ref=null}
})();

try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.hostname)){navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{if(!ref){syncMsg='Saved on this device · works offline';if(!$('#app').hidden)$('#sync').textContent=syncMsg}}).catch(()=>{})}}catch(e){}
drawDots();
}
</script>
